<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 660" width="1480" height="660" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EA580C"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284C7"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- ================= BACKGROUND CONTAINERS ================= -->

  <!-- Cloudflare Anycast Global Edge Container -->
  <g transform="translate(250, 25)">
    <rect width="750" height="605" rx="12" fill="#FFFBF7" stroke="#F38020" stroke-width="2" stroke-dasharray="8 6" filter="url(#shadow)"/>
    <rect width="750" height="40" rx="12" fill="#F38020"/>
    <rect y="28" width="750" height="12" fill="#F38020"/>
    <text x="24" y="26" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="1">CLOUDFLARE ANYCAST GLOBAL EDGE (ZONE: CAMBRERA.NET)</text>
  </g>

  <!-- AWS Origin Container -->
  <g transform="translate(1040, 25)">
    <rect width="405" height="605" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="2" stroke-dasharray="8 6" filter="url(#shadow)"/>
    <rect width="405" height="40" rx="12" fill="#334155"/>
    <rect y="28" width="405" height="12" fill="#334155"/>
    <text x="24" y="26" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="1">AWS CLOUD ORIGIN (ZERO INBOUND INGRESS)</text>
  </g>

  <!-- ================= CLIENT TIER (LEFT) ================= -->
  <!-- End User -->
  <g transform="translate(45, 230)">
    <circle cx="40" cy="30" r="18" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
    <path d="M22 68 C22 50, 58 50, 58 68" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
    <text x="40" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">End User</text>
    <text x="40" y="110" text-anchor="middle" font-size="11" fill="#64748B">Browser / Client</text>
  </g>

  <!-- ================= CLOUDFLARE EDGE COMPONENTS ================= -->

  <!-- 1. DNS Resolution (Globe with Lat/Long Grid) -->
  <g transform="translate(290, 85)">
    <rect width="180" height="115" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <!-- Globe Icon -->
    <g transform="translate(70, 10)">
      <circle cx="20" cy="20" r="16" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/>
      <ellipse cx="20" cy="20" rx="7" ry="16" fill="none" stroke="#F38020" stroke-width="2"/>
      <line x1="20" y1="4" x2="20" y2="36" stroke="#1E293B" stroke-width="1.8"/>
      <line x1="4" y1="20" x2="36" y2="20" stroke="#F38020" stroke-width="2"/>
      <path d="M7 12 C12 14, 28 14, 33 12" fill="none" stroke="#1E293B" stroke-width="1.5"/>
      <path d="M7 28 C12 26, 28 26, 33 28" fill="none" stroke="#1E293B" stroke-width="1.5"/>
    </g>
    <text x="90" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">Cloudflare DNS</text>
    <text x="90" y="81" text-anchor="middle" font-size="10.5" font-weight="600" fill="#F38020">cambrera.net</text>
    <text x="90" y="94" text-anchor="middle" font-size="8.5" fill="#475569">bradley &amp; evelyn.ns</text>
    <text x="90" y="105" text-anchor="middle" font-size="8" fill="#64748B">Authoritative Anycast</text>
  </g>

  <!-- 2. CDN / Tiered Cache -->
  <g transform="translate(540, 85)">
    <rect width="180" height="115" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <!-- CDN Stencil Icon -->
    <g transform="translate(70, 12)">
      <path d="M8 26 A14 14 0 0 1 32 26" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/>
      <path d="M12 26 A10 10 0 0 1 28 26" fill="none" stroke="#F38020" stroke-width="2"/>
      <circle cx="20" cy="26" r="3" fill="#F38020"/>
      <line x1="20" y1="26" x2="20" y2="34" stroke="#1E293B" stroke-width="2"/>
      <line x1="10" y1="34" x2="30" y2="34" stroke="#1E293B" stroke-width="2"/>
    </g>
    <text x="90" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">CDN &amp; Tiered Cache</text>
    <text x="90" y="81" text-anchor="middle" font-size="10.5" font-weight="600" fill="#F38020">www.cambrera.net</text>
    <text x="90" y="94" text-anchor="middle" font-size="8.5" fill="#475569">TLS 1.3 Strict | Brotli</text>
    <text x="90" y="105" text-anchor="middle" font-size="8" fill="#64748B">Edge Caching &amp; Redirects</text>
  </g>

  <!-- 3. Zero Trust Access (Policy Interception) -->
  <g transform="translate(290, 240)">
    <rect width="140" height="130" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5" filter="url(#card-shadow)"/>
    <!-- Lock Shield Icon -->
    <g transform="translate(50, 14)">
      <path d="M20 4 L8 9 V20 C8 28 20 34 20 34 C20 34 32 28 32 20 V9 Z" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
      <circle cx="20" cy="18" r="3" fill="#DC2626"/>
      <line x1="20" y1="21" x2="20" y2="25" stroke="#DC2626" stroke-width="2"/>
    </g>
    <text x="70" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">Zero Trust Access</text>
    <text x="70" y="85" text-anchor="middle" font-size="10.5" font-weight="600" fill="#DC2626">Policy Evaluation</text>
    <text x="70" y="99" text-anchor="middle" font-size="8.5" fill="#475569">Route: /secure*</text>
    <text x="70" y="112" text-anchor="middle" font-size="8" fill="#64748B">Blocks Unauthenticated</text>
  </g>

  <!-- 4. IdP Identity Federation (Google / OTP) -->
  <g transform="translate(460, 240)">
    <rect width="140" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <!-- ID Badge Icon -->
    <g transform="translate(50, 14)">
      <rect x="6" y="4" width="28" height="32" rx="3" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/>
      <circle cx="20" cy="16" r="5" fill="#F38020"/>
      <line x1="12" y1="26" x2="28" y2="26" stroke="#64748B" stroke-width="2"/>
      <line x1="14" y1="30" x2="26" y2="30" stroke="#CBD5E1" stroke-width="1.5"/>
    </g>
    <text x="70" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">IdP Federation</text>
    <text x="70" y="85" text-anchor="middle" font-size="10.5" font-weight="600" fill="#F38020">Google SSO / OTP</text>
    <text x="70" y="99" text-anchor="middle" font-size="8.5" fill="#475569">@cloudflare.com</text>
    <text x="70" y="112" text-anchor="middle" font-size="8" fill="#64748B">Issues JWT Assertion</text>
  </g>

  <!-- 5. Cloudflare Worker (flag_svc) Landing Page -->
  <g transform="translate(635, 235)">
    <rect width="210" height="150" rx="10" fill="#FFFFFF" stroke="#F38020" stroke-width="2" filter="url(#card-shadow)"/>
    <rect width="210" height="32" rx="10" fill="#FFF7ED"/>
    <rect y="22" width="210" height="10" fill="#FFF7ED"/>
    <text x="105" y="21" text-anchor="middle" font-size="11" font-weight="800" fill="#EA580C">Cloudflare Worker (flag_svc)</text>
    
    <text x="105" y="48" text-anchor="middle" font-size="10" font-weight="700" fill="#0284C7">tunnel.cambrera.net/secure</text>
    <text x="105" y="62" text-anchor="middle" font-size="8.5" fill="#64748B">CF-IPCountry &amp; caches.default</text>
    
    <!-- 3 Action Links Inside Worker Box -->
    <rect x="10" y="72" width="190" height="21" rx="3" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="105" y="86" text-anchor="middle" font-size="9" font-weight="700" fill="#C2410C">🔗 1. View Flag (/secure/:country)</text>

    <rect x="10" y="98" width="190" height="21" rx="3" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="105" y="112" text-anchor="middle" font-size="9" font-weight="700" fill="#1D4ED8">🔗 2. View Headers (/secure/headers)</text>

    <rect x="10" y="124" width="190" height="21" rx="3" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="105" y="138" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569">🔗 3. View Headers (No Auth: /)</text>
  </g>

  <!-- 6. Private R2 Storage (Standalone Storage Origin) -->
  <g transform="translate(875, 235)">
    <rect width="110" height="150" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="2" filter="url(#card-shadow)"/>
    <rect width="110" height="26" rx="8" fill="#FFF7ED"/>
    <rect y="18" width="110" height="8" fill="#FFF7ED"/>
    <text x="55" y="18" text-anchor="middle" font-size="9.5" font-weight="800" fill="#EA580C">R2 STORAGE</text>
    <text x="55" y="28" text-anchor="middle" font-size="8" font-weight="700" fill="#C2410C">(STANDALONE ORIGIN)</text>
    <!-- Cloudflare R2 Storage Bucket Icon -->
    <g transform="translate(35, 34)">
      <path d="M8 12 V30 C8 34 32 34 32 30 V12" fill="#FFF7ED" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 20 C8 24 32 24 32 20" stroke="#94A3B8" stroke-width="1.5"/>
      <ellipse cx="20" cy="12" rx="12" ry="5" fill="#F38020" stroke="#1E293B" stroke-width="2"/>
      <rect x="15" y="19" width="10" height="6" rx="1.5" fill="#F38020"/>
      <text x="20" y="24" text-anchor="middle" font-size="5" font-weight="900" fill="#FFFFFF">R2</text>
    </g>
    <text x="55" y="85" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1E293B">Flags Bucket</text>
    <text x="55" y="99" text-anchor="middle" font-size="8.5" font-weight="600" fill="#F38020">272 SVG Flags</text>
    <text x="55" y="112" text-anchor="middle" font-size="8" fill="#475569">Native Worker</text>
    <text x="55" y="122" text-anchor="middle" font-size="8" fill="#475569">Binding</text>
    <text x="55" y="137" text-anchor="middle" font-size="7.5" font-weight="700" fill="#16A34A">NO AWS EGRESS</text>
  </g>

  <!-- 7. Cloudflare Tunnel Edge (tunnel.cambrera.net) -->
  <g transform="translate(635, 475)">
    <rect width="210" height="95" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.8" filter="url(#card-shadow)"/>
    <!-- Edge Tunnel Icon -->
    <g transform="translate(85, 10)">
      <rect x="6" y="8" width="28" height="22" rx="4" fill="#0284C7" opacity="0.15"/>
      <rect x="6" y="8" width="28" height="22" rx="4" fill="none" stroke="#0284C7" stroke-width="2"/>
      <circle cx="12" cy="19" r="2" fill="#0284C7"/>
      <circle cx="20" cy="19" r="2" fill="#0284C7"/>
      <circle cx="28" cy="19" r="2" fill="#0284C7"/>
    </g>
    <text x="105" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">Cloudflare Tunnel Edge</text>
    <text x="105" y="76" text-anchor="middle" font-size="10" font-weight="600" fill="#0284C7">tunnel.cambrera.net</text>
    <text x="105" y="89" text-anchor="middle" font-size="8.5" fill="#64748B">Terminates Outbound QUIC Stream</text>
  </g>

  <!-- ================= AWS ORIGIN COMPONENTS ================= -->

  <!-- 1. AWS Security Group (Allow CF IPs / Drop Other) -->
  <g transform="translate(1065, 85)">
    <rect width="355" height="65" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="177" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B">AWS Security Group</text>
    <text x="177" y="40" text-anchor="middle" font-size="11" font-weight="600" fill="#15803D">Allow Cloudflare IP Ranges (Port 443)</text>
    <text x="177" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">DROP ALL OTHER DIRECT TRAFFIC</text>
  </g>

  <!-- 2. AWS ALB (Public CDN Origin) -->
  <g transform="translate(1065, 175)">
    <rect width="355" height="75" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="177" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#6D28D9">AWS Application Load Balancer (ALB)</text>
    <text x="177" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">Public CDN Origin (www.cambrera.net)</text>
    <text x="177" y="58" text-anchor="middle" font-size="10" fill="#6D28D9">ACM Cert: www-origin.cambrera.net</text>
  </g>

  <!-- 3. cloudflared Sidecar Daemon (Zero Trust Route) -->
  <g transform="translate(1065, 290)">
    <rect width="355" height="85" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="177" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#0369A1">cloudflared Sidecar Daemon</text>
    <text x="177" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">Tunnel UUID: bafe27e6-f0e1</text>
    <text x="177" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#0284C7">Outbound QUIC (UDP 7844) | Zero Ingress</text>
    <text x="177" y="72" text-anchor="middle" font-size="9" fill="#64748B">Origin Cloaked from Public Scanners</text>
  </g>

  <!-- 4. HTTP-Echo Origin Container -->
  <g transform="translate(1065, 475)">
    <rect width="355" height="85" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="177" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C">HTTP-Echo Application Container</text>
    <text x="177" y="44" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">Localhost:8080 (Elastic Beanstalk Backend)</text>
    <text x="177" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#C2410C">Returns Request Headers JSON</text>
    <text x="177" y="74" text-anchor="middle" font-size="9" fill="#64748B">Echoes Host, CF-Connecting-IP, Cookies</text>
  </g>

  <!-- AWS Origin Internal Routing -->
  <!-- ALB forwards to container on port 80 -->
  <path d="M1420 215 L1455 215 L1455 515 L1420 515" fill="none" stroke="#8B5CF6" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <rect x="1395" y="350" width="110" height="20" rx="3" fill="#EDE9FE"/>
  <text x="1450" y="364" text-anchor="middle" font-size="8.5" font-weight="600" fill="#6D28D9">Forward Port 80</text>

  <!-- cloudflared forwards directly to localhost:8080 (BYPASSING ALB!) -->
  <path d="M1242 375 L1242 475" fill="none" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
  <rect x="1142" y="415" width="200" height="24" rx="4" fill="#F0F9FF" stroke="#BAE6FD"/>
  <text x="1242" y="431" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0369A1">Forward to localhost:8080 (Bypasses ALB)</text>

  <!-- ================= CROSS-ZONE / EXTERNAL CONNECTIONS ================= -->

  <!-- Flow 1: GET / (homepage allowed) -> DNS -> CDN -->
  <path d="M120 260 L200 260 L200 142 L290 142" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="125" y="129" width="155" height="26" rx="4" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="202" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#1D4ED8">GET / (homepage allowed)</text>

  <!-- DNS to CDN (Proxied CNAME) -->
  <path d="M470 142 L540 142" fill="none" stroke="#F38020" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="478" y="129" width="54" height="18" rx="3" fill="#FFF7ED"/>
  <text x="505" y="142" text-anchor="middle" font-size="9" font-weight="700" fill="#C2410C">CNAME</text>

  <!-- CDN Proxy to AWS ALB (Public HTTPS Route) -->
  <path d="M720 142 L1000 142 L1000 212 L1065 212" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow-slate)"/>
  <rect x="750" y="129" width="220" height="22" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="860" y="144" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">Public HTTPS (www.cambrera.net)</text>

  <!-- Flow 2: GET /secure* -> Access -->
  <path d="M120 280 L200 280 L200 305 L290 305" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="140" y="292" width="125" height="26" rx="4" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="202" y="309" text-anchor="middle" font-size="11" font-weight="700" fill="#B91C1C">GET /secure*</text>

  <!-- Access -> IDP Challenge -->
  <path d="M430 305 L460 305" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="445" y="297" text-anchor="middle" font-size="8" font-weight="700" fill="#B91C1C">Auth</text>

  <!-- IDP -> Worker (flag_svc) -->
  <path d="M600 305 L635 305" fill="none" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="618" y="297" text-anchor="middle" font-size="8" font-weight="700" fill="#15803D">Session</text>

  <!-- Cloudflare Worker Native Binding to R2 (Origin) -->
  <path d="M845 285 L875 285" fill="none" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="860" y="278" text-anchor="middle" font-size="7.5" font-weight="800" fill="#C2410C">Binding</text>

  <!-- R2 to Worker (SVG Stream - No AWS Tunnel hop!) -->
  <path d="M875 325 L845 325" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="860" y="338" text-anchor="middle" font-size="7.5" font-weight="700" fill="#15803D">SVG Stream</text>

  <!-- Worker Link 2: View Headers w/ Auth -> Tunnel Edge -->
  <path d="M740 385 L740 475" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="748" y="415" width="145" height="22" rx="3" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="820" y="430" text-anchor="middle" font-size="9" font-weight="700" fill="#1D4ED8">2. View Headers w/ Auth</text>

  <!-- Worker Link 3: View Headers w/out Auth -> Tunnel Edge (Direct) -->
  <path d="M660 385 L660 475" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-slate)"/>
  <rect x="525" y="415" width="130" height="22" rx="3" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="590" y="430" text-anchor="middle" font-size="8.5" font-weight="600" fill="#475569">3. No Auth (Direct /)</text>

  <!-- PERSISTENT OUTBOUND-ONLY QUIC TUNNEL (Tunnel Edge to cloudflared Daemon) -->
  <!-- Note: Connected strictly between Cloudflare Edge and EC2 Daemon, NOT R2! -->
  <path d="M845 522 L965 522 L965 332 L1065 332" fill="none" stroke="#0284C7" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow-cyan)"/>
  <rect x="860" y="507" width="200" height="24" rx="4" fill="#F0F9FF" stroke="#BAE6FD"/>
  <text x="960" y="523" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0369A1">OUTBOUND QUIC (UDP 7844)</text>

</svg>
