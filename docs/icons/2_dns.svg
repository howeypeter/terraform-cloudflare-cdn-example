  <line x1="18" y1="19" x2="26" y2="19" stroke="#F38020" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="42" cy="19" r="2" fill="#F38020"/>
  <circle cx="47" cy="19" r="2" fill="#10B981"/>

