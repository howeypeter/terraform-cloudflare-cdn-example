<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer Globe Sphere -->
  <circle cx="12" cy="12" r="10" stroke="#1E293B" stroke-width="2" fill="#FFFFFF"/>
  
  <!-- Central Longitude Ellipse (Grid) -->
  <ellipse cx="12" cy="12" rx="4.5" ry="10" stroke="#F38020" stroke-width="2"/>
  
  <!-- Vertical Axis -->
  <line x1="12" y1="2" x2="12" y2="22" stroke="#1E293B" stroke-width="1.8"/>

  <!-- Equator Line -->
  <line x1="2" y1="12" x2="22" y2="12" stroke="#F38020" stroke-width="2"/>
  
  <!-- Northern Parallel (Latitude Grid) -->
  <path d="M4.2 7.2 C7 8.5, 17 8.5, 19.8 7.2" stroke="#1E293B" stroke-width="1.8"/>
  
  <!-- Southern Parallel (Latitude Grid) -->
  <path d="M4.2 16.8 C7 15.5, 17 15.5, 19.8 16.8" stroke="#1E293B" stroke-width="1.8"/>
</svg>
