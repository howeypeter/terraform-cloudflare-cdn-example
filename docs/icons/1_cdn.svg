    <path fill="#FAAE40" d="M410.8 139.7c-9.7-.7-19.6.5-29.4 3.6-1.5 6.7-2.7 13.5-3.6 20.5 9.7-2.9 19.5-4.2 29.3-3.6 1.3-6.8 2.5-13.7 3.7-20.5z"/>
