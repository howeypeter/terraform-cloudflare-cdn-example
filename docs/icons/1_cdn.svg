    <circle cx="32" cy="48" r="4" fill="#F38020" stroke="#1E293B" stroke-width="2"/>
    <circle cx="50" cy="48" r="4" fill="#FFF7ED" stroke="#F38020" stroke-width="2"/>
  </g>
</svg>
